version: '3.8'

services:
  vera-bot:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=8080
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_TIMEOUT_MS=${LLM_TIMEOUT_MS:-20000}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-600}
      - LLM_MAX_TOKENS_REPLY=${LLM_MAX_TOKENS_REPLY:-400}
      - LLM_CALLS_PER_MINUTE=${LLM_CALLS_PER_MINUTE:-30}
      - TEAM_NAME=${TEAM_NAME}
      - TEAM_MEMBERS=${TEAM_MEMBERS}
      - CONTACT_EMAIL=${CONTACT_EMAIL}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/v1/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
